# === Key bindings ===
# Colemak hnei = left/down/up/right

# --- Reload ---
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# --- Splits (open in current path) ---
unbind '"'
unbind %
unbind |
unbind -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"

# --- Pane navigation ---
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l
bind h select-pane -L
bind n select-pane -D
bind e select-pane -U
bind i select-pane -R

# --- Pane resize (repeatable) ---
unbind -n M-h
unbind -n M-j
unbind -n M-k
unbind -n M-l
bind -r H resize-pane -L 5
bind -r N resize-pane -D 2
bind -r E resize-pane -U 2
bind -r I resize-pane -R 5

# --- Window switching ---
bind u next-window
bind y previous-window

# --- Copy mode (vi, Colemak) ---
bind-key -T copy-mode-vi h send -X cursor-left
bind-key -T copy-mode-vi n send -X cursor-down
bind-key -T copy-mode-vi e send -X cursor-up
bind-key -T copy-mode-vi i send -X cursor-right
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "pbcopy"
