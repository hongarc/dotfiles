# === Prefix ===
# SSH session → Ctrl-b (default); local → Ctrl-m
if-shell 'test -n "$SSH_TTY"' \
  'set -g prefix C-b; bind C-b send-prefix' \
  'unbind C-b; set -g prefix C-m; bind C-m send-prefix'

# === Modules ===
source-file ~/.config/tmux/options.conf
source-file ~/.config/tmux/theme.conf
source-file ~/.config/tmux/keys.conf
source-file ~/.config/tmux/plugins.conf
