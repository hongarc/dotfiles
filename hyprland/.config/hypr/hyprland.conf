# =========================
# Hyprland config (Fedora)
# =========================

# ----- Monitor -----
# Adjust positions to match your physical layout.
monitor = DP-4, preferred, 0x0, 1
monitor = HDMI-A-4, preferred, auto-right, 1
monitor = , preferred, auto, 1

# ----- Environment -----
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1
env = XCURSOR_SIZE,24

# Vietnamese input via fcitx5 + Unikey (Telex/VNI)
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx
env = INPUT_METHOD,fcitx

# ----- Input (Colemak) -----
input {
    kb_layout = us
    kb_variant = colemak
    follow_mouse = 1
    accel_profile = flat
}

# ----- General -----
# Multi-window: each app gets its own border + gap between apps.
# Single-window: workspace rules below remove border + gaps.
general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    col.active_border = rgba(8caaeeff) rgba(ca9ee6ff) 45deg
    col.inactive_border = rgba(414559ff)
}

# ----- Decoration -----
decoration {
    rounding = 2

    blur {
        enabled = yes
        size = 5
        passes = 2
    }

    shadow {
        enabled = yes
        range = 20
        render_power = 3
        color = rgba(00000055)
    }
}

# ----- Animations (smoother curves) -----
animations {
    enabled = yes
    bezier = overshot,    0.05, 0.9, 0.1, 1.1
    bezier = smoothOut,   0.36, 0,   0.66, -0.56
    bezier = smoothIn,    0.25, 1,   0.5,  1
    animation = windows,        1, 5, overshot, slide
    animation = windowsOut,     1, 4, smoothOut, slide
    animation = windowsMove,    1, 4, default
    animation = border,         1, 10, default
    animation = borderangle,    1, 8,  default
    animation = fade,           1, 4, smoothIn
    animation = fadeDim,        1, 4, smoothIn
    animation = workspaces,     1, 5, overshot, slidevert
    animation = specialWorkspace, 1, 5, overshot, slidevert
}

# ----- Misc -----
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true            # focus follows window-activate signals
    enable_swallow = true                # terminal hides when it spawns a GUI app
    swallow_regex = ^(com\.mitchellh\.ghostty|ghostty)$
}

# ----- Layout: dwindle -----
dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false                # don't use cursor position — predictable splits
    smart_resizing = true
    force_split = 2                    # 2 = new window opens to the right/bottom of focused
    # Direction (horizontal vs vertical) follows the focused window's longer side:
    # on a wide 1920×1080 the window is wider than tall → new window splits horizontally
    # → new window appears to the RIGHT of the focused one.
    # Use SUPER+J (togglesplit) to flip orientation per-pair.
}

# ----- "No border/gaps when only one window" (Hyprland >= 0.49 syntax) -----
# Match workspaces that have exactly 1 tiled-visible window OR 1 fullscreen
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1],   gapsout:0, gapsin:0
windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
windowrulev2 = rounding 0,   floating:0, onworkspace:w[tv1]
windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
windowrulev2 = rounding 0,   floating:0, onworkspace:f[1]

# ----- Window rules -----
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin,   title:^(Picture-in-Picture)$
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save As)$

# Per-app default workspace placements
windowrulev2 = workspace 4 silent, class:^(Spotify|spotify)$
windowrulev2 = workspace 5 silent, class:^(discord|Discord)$
windowrulev2 = workspace 5 silent, class:^(Slack|slack)$

# Pyprland scratchpads
windowrulev2 = float, class:^(scratchpad-.*)$
windowrulev2 = workspace special silent, class:^(scratchpad-.*)$

# ----- Per-monitor workspaces -----
# Workspaces 1-5 live on DP-4, 6-10 live on HDMI-A-4
workspace = 1, monitor:DP-4, default:true
workspace = 2, monitor:DP-4
workspace = 3, monitor:DP-4
workspace = 4, monitor:DP-4
workspace = 5, monitor:DP-4
workspace = 6, monitor:HDMI-A-4, default:true
workspace = 7, monitor:HDMI-A-4
workspace = 8, monitor:HDMI-A-4
workspace = 9, monitor:HDMI-A-4
workspace = 10, monitor:HDMI-A-4

# =========================
# Keybinds
# =========================

# ----- Apps -----
bind = SUPER, Return, exec, ghostty
bind = SUPER, C, exec, google-chrome-stable
bind = SUPER, R, exec, fuzzel
bind = SUPER, A, exec, pavucontrol
bind = SUPER, L, exec, hyprlock
bind = SUPER, M, exec, ~/.config/hypr/scripts/mic-monitor.sh

# ----- Power / notification center / picker -----
bind = SUPER SHIFT, L,    exec, wlogout
bind = SUPER, Backslash,  exec, swaync-client -t -sw      # toggle notification panel
bind = SUPER, K,          exec, hyprpicker -a -f hex      # color picker (auto-copy hex)

# ----- Pyprland scratchpads (Quake-style drop-downs) -----
bind = SUPER, T,          exec, pypr toggle term
bind = SUPER, Y,          exec, pypr toggle files
bind = SUPER, U,          exec, pypr toggle music

# ----- Show desktop (toggle special workspace 'hidden') -----
bind = SUPER, D, togglespecialworkspace, hidden
bind = SUPER SHIFT, D, movetoworkspacesilent, special:hidden

# ----- Wallpaper rotation -----
bind = SUPER, W,           exec, ~/.config/hypr/scripts/wallpaper.sh           # random
bind = SUPER SHIFT, W,     exec, ~/.config/hypr/scripts/wallpaper.sh next      # next
bind = SUPER CTRL, W,      exec, ~/.config/hypr/scripts/wallpaper.sh prev      # previous

# ----- Window management -----
bind = SUPER, Q, killactive
bind = SUPER SHIFT, M, exit
bind = SUPER, V, togglefloating
bind = SUPER, F, fullscreen, 0
bind = SUPER, P, pseudo
bind = SUPER, J, togglesplit

# ----- Mouse drag -----
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# ----- Mouse side buttons (back/forward) switch workspaces -----
bind = , mouse:275, workspace, e-1     # back  -> previous existing workspace
bind = , mouse:276, workspace, e+1     # forward -> next existing workspace

# ----- Cycle / switch windows in current workspace -----
bind = SUPER, Tab,            cyclenext              # next window
bind = SUPER SHIFT, Tab,      cyclenext, prev        # previous window
bind = SUPER, grave,          focuscurrentorlast     # toggle last 2 (Alt-Tab style)

# ----- Focus (Colemak HNEI) -----
bind = SUPER, H, movefocus, l   # left
bind = SUPER, N, movefocus, d   # down
bind = SUPER, E, movefocus, u   # up
bind = SUPER, I, movefocus, r   # right

# ----- Move windows (Colemak HNEI) -----
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, N, movewindow, d
bind = SUPER SHIFT, E, movewindow, u
bind = SUPER SHIFT, I, movewindow, r

# ----- Workspaces -----
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# ----- Move windows to workspaces -----
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# ----- Multi-monitor (no function keys) -----
# Focus monitor
bind = SUPER, COMMA, focusmonitor, DP-4
bind = SUPER, DOT, focusmonitor, HDMI-A-4

# Move window to monitor
bind = SUPER SHIFT, COMMA, movewindow, mon:DP-4
bind = SUPER SHIFT, DOT, movewindow, mon:HDMI-A-4

# ----- Screenshot (hyprshot — saves to ~/Pictures/Screenshots and copies) -----
bind = , Print,            exec, hyprshot -m region                      # region
bind = SHIFT, Print,       exec, hyprshot -m output                      # full screen (active output)
bind = SUPER, Print,       exec, hyprshot -m window                      # focused window
bind = CTRL, Print,        exec, hyprshot -m region --clipboard-only     # region → clipboard only

# ----- Screenshot submap (modal, S then a key) -----
bind = SUPER, S, submap, screenshot
submap = screenshot
bind = , r, exec, hyprshot -m region
bind = , r, submap, reset
bind = , w, exec, hyprshot -m window
bind = , w, submap, reset
bind = , f, exec, hyprshot -m output
bind = , f, submap, reset
bind = , escape, submap, reset
submap = reset

# ----- Clipboard history (cliphist + fuzzel) -----
bind = SUPER, X, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# ----- Media keys (volume only — desktop has no backlight) -----
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ toggle

# =========================
# Autostart
# =========================
exec-once = waybar
exec-once = swaync                                                          # notification center (replaces mako)
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1
exec-once = swww-daemon                                                     # wallpaper daemon
exec-once = sleep 1 && ~/.config/hypr/scripts/wallpaper.sh                  # random pick on login
exec-once = hypridle
exec-once = pypr                                                            # pyprland scratchpads
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = fcitx5 -d                                                       # Vietnamese / IME daemon
