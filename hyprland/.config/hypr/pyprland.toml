[pyprland]
plugins = [
    "scratchpads",
]

# Drop-down terminal — toggle with SUPER+T
[scratchpads.term]
command = "ghostty --class=scratchpad-term"
class = "scratchpad-term"
size = "75% 65%"
margin = 50
lazy = true

# Floating yazi file manager — SUPER+Y
[scratchpads.files]
command = "ghostty --class=scratchpad-files -e yazi"
class = "scratchpad-files"
size = "70% 70%"
margin = 50
lazy = true

# Music slot — SUPER+U
[scratchpads.music]
command = "ghostty --class=scratchpad-music"
class = "scratchpad-music"
size = "40% 60%"
margin = 50
lazy = true
