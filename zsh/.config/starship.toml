command_timeout = 1000

format = """
[](#9A348E)\
$os\
$username\
[](bg:#E78284 fg:#9A348E)\
$directory\
[](fg:#E78284 bg:#FF8A65)\
$git_branch\
$git_status\
[](fg:#FF8A65 bg:#4c6c8e)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$python\
$rust\
$scala\
[](fg:#4c6c8e bg:#2f6d68)\
$docker_context\
[](fg:#2f6d68 bg:#2b4f77)\
$time\
[ ](fg:#2b4f77)\
"""

# Right prompt — DevOps context modules.
# These render only when relevant (active k8s context, non-default terraform
# workspace, AWS_PROFILE set, gcloud project configured), so everyday shells
# stay clean.
right_format = """
$kubernetes\
$terraform\
$aws\
$gcloud\
"""

[username]
show_always = true
style_user = "bg:#9A348E"
style_root = "bg:#9A348E"
format = '[$user ]($style)'
disabled = false

[os]
style = "bg:#9A348E"
disabled = true

[directory]
style = "bg:#E78284"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[c]
symbol = " "
style = "bg:#4c6c8e"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#2f6d68"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#4c6c8e"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#4c6c8e"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#FF8A65"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#FF8A65"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#4c6c8e"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#4c6c8e"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#4c6c8e"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#4c6c8e"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#4c6c8e"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#4c6c8e"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#4c6c8e"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#4c6c8e"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#4c6c8e"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#2b4f77"
format = '[ ♥ $time ]($style)'

# ===== LANGUAGE RUNTIMES =====

[python]
symbol = " "
style = "bg:#4c6c8e"
# Show version + active virtualenv name when inside a python project
format = '[ $symbol ($version)($virtualenv) ]($style)'
# Only show when a python-indicator file is present (pyproject.toml, etc.)
detect_files = ["pyproject.toml", "requirements.txt", "setup.py", ".python-version", "Pipfile", "*.py"]

# ===== DEVOPS CONTEXT MODULES (right_format) =====

# Kubernetes — shows context/namespace.
# disabled=true is starship's default; set false to enable.
# Use `detect_files` + `contexts` to show only in relevant dirs if desired.
[kubernetes]
disabled = false
symbol = "☸ "
format = '[$symbol$context( \($namespace\))](bold blue) '
# Optionally filter to specific contexts only:
# [kubernetes.context_aliases]
# "arn:aws:eks:.*:.*:cluster/(.*)" = "$1"   # strip ARN prefix for EKS

# Terraform — shows active workspace (hidden when "default").
[terraform]
disabled = false
symbol = "󱁢 "
format = '[$symbol$workspace](bold 105) '

# AWS — shows profile + region when AWS_PROFILE or AWS_DEFAULT_REGION is set.
[aws]
disabled = false
symbol = " "
format = '[$symbol($profile)(\($region\))](bold 208) '
# Region display aliases — add your own:
# [aws.region_aliases]
# "ap-southeast-1" = "sg"
# "us-east-1"      = "us-e1"

# Google Cloud — shows active project (and account if different from default).
[gcloud]
disabled = false
symbol = " "
format = '[$symbol$project( \($region\))](bold 32) '
