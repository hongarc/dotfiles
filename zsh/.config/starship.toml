command_timeout = 1000
scan_timeout = 50

format = """
[](#ca9ee6)\
$os\
$username\
[](bg:#8caaee fg:#ca9ee6)\
$directory\
[](fg:#8caaee bg:#ef9f76)\
$git_branch\
$git_status\
[](fg:#ef9f76 bg:#85c1dc)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$python\
$rust\
$scala\
[](fg:#85c1dc bg:#a6d189)\
$docker_context\
[](fg:#a6d189 bg:#babbf1)\
$time\
[ ](fg:#babbf1)\
"""


[username]
show_always = true
style_user = "fg:#232634 bg:#ca9ee6"
style_root = "fg:#232634 bg:#ca9ee6"
format = '[$user ]($style)'
disabled = false

[os]
style = "fg:#232634 bg:#ca9ee6"
disabled = true

[directory]
style = "fg:#232634 bg:#8caaee"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[c]
symbol = " "
style = "fg:#232634 bg:#85c1dc"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "fg:#232634 bg:#a6d189"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "fg:#232634 bg:#85c1dc"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "fg:#232634 bg:#85c1dc"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "fg:#232634 bg:#ef9f76"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:#232634 bg:#ef9f76"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "fg:#232634 bg:#85c1dc"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "fg:#232634 bg:#85c1dc"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "fg:#232634 bg:#85c1dc"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "fg:#232634 bg:#85c1dc"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "fg:#232634 bg:#85c1dc"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "fg:#232634 bg:#85c1dc"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "fg:#232634 bg:#85c1dc"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "fg:#232634 bg:#85c1dc"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "fg:#232634 bg:#85c1dc"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "fg:#232634 bg:#babbf1"
format = '[ ♥ $time ]($style)'

# ===== LANGUAGE RUNTIMES =====

[python]
symbol = " "
style = "fg:#232634 bg:#85c1dc"
# Show version + active virtualenv name when inside a python project
format = '[ $symbol ($version)($virtualenv) ]($style)'
# Only show when a python-indicator file is present (pyproject.toml, etc.)
detect_files = ["pyproject.toml", "requirements.txt", "setup.py", ".python-version", "Pipfile", "*.py"]

