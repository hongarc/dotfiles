# Catppuccin frappe powerline: deeper accents, bold dark crust (#232634) text,
# crust dividers between segments. Glyphs preserved from the original config.
command_timeout = 1000
scan_timeout = 50

format = """
[](#b58ed6)\
$os\
$username\
[](fg:#b58ed6 bg:#232634)[](fg:#232634 bg:#7b9ae0)\
$directory\
[](fg:#7b9ae0 bg:#232634)[](fg:#232634 bg:#e58d5d)\
$git_branch\
$git_status\
[](fg:#e58d5d bg:#232634)[](fg:#232634 bg:#6fb3cf)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$python\
$rust\
$scala\
[](fg:#6fb3cf bg:#232634)[](fg:#232634 bg:#93c573)\
$docker_context\
[](fg:#93c573 bg:#232634)[](fg:#232634 bg:#a4a5e8)\
$time\
[ ](fg:#a4a5e8)\
"""


[username]
show_always = true
style_user = "bold fg:#232634 bg:#b58ed6"
style_root = "bold fg:#232634 bg:#b58ed6"
format = '[$user ]($style)'
disabled = false

[os]
style = "bold fg:#232634 bg:#b58ed6"
disabled = true

[directory]
style = "bold fg:#232634 bg:#7b9ae0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[c]
symbol = " "
style = "bold fg:#232634 bg:#6fb3cf"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bold fg:#232634 bg:#93c573"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bold fg:#232634 bg:#6fb3cf"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bold fg:#232634 bg:#6fb3cf"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bold fg:#232634 bg:#e58d5d"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bold fg:#232634 bg:#e58d5d"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bold fg:#232634 bg:#6fb3cf"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bold fg:#232634 bg:#6fb3cf"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bold fg:#232634 bg:#6fb3cf"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bold fg:#232634 bg:#6fb3cf"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bold fg:#232634 bg:#6fb3cf"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bold fg:#232634 bg:#6fb3cf"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bold fg:#232634 bg:#6fb3cf"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bold fg:#232634 bg:#6fb3cf"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bold fg:#232634 bg:#6fb3cf"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bold fg:#232634 bg:#a4a5e8"
format = '[ ♥ $time ]($style)'

# ===== LANGUAGE RUNTIMES =====

[python]
symbol = " "
style = "bold fg:#232634 bg:#6fb3cf"
# Show version + active virtualenv name when inside a python project
format = '[ $symbol ($version)($virtualenv) ]($style)'
# Only show when a python-indicator file is present (pyproject.toml, etc.)
detect_files = ["pyproject.toml", "requirements.txt", "setup.py", ".python-version", "Pipfile", "*.py"]

